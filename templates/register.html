<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Create an account | TransLingo</title>
</head>
<body class="min-h-screen bg-[#f7f5ee] text-[#132a13]">
    <main class="flex min-h-screen flex-col lg:flex-row">
        <section class="relative flex min-h-[32vh] flex-1 flex-col justify-center overflow-hidden bg-[#132a13] px-8 py-12 text-white sm:px-12 lg:min-h-screen lg:px-16">
            <div class="pointer-events-none absolute -right-20 -top-24 h-72 w-72 rounded-full border border-white/10"></div>
            <div class="pointer-events-none absolute -right-10 -top-14 h-52 w-52 rounded-full border border-white/10"></div>
            <div class="relative mx-auto w-full max-w-lg">
                <p class="text-sm font-semibold uppercase tracking-[0.3em] text-[#f2e8cf]">TransLingo</p>
                <h1 class="mt-8 text-4xl font-bold leading-tight sm:text-5xl">A world of words, closer than ever.</h1>
                <p class="mt-5 max-w-md text-lg leading-relaxed text-white/75">Create your account and make every conversation count, whatever language you speak.</p>
                <div class="mt-10 flex items-center gap-3 text-sm text-white/70">
                    <span class="h-px w-10 bg-[#f2e8cf]"></span>
                    <span>Connect beyond language</span>
                </div>
            </div>
        </section>

        <div class="relative z-10 flex h-10 items-center justify-center lg:absolute lg:inset-y-0 lg:left-1/2 lg:w-0 lg:-translate-x-1/2">
            <span class="h-px w-16 bg-[#a7c957] lg:h-full lg:w-px lg:bg-gradient-to-b lg:from-transparent lg:via-[#a7c957] lg:to-transparent"></span>
            <span class="absolute flex h-9 w-9 items-center justify-center rounded-full border border-[#d8dfc7] bg-[#f7f5ee] text-sm text-[#6a994e] shadow-sm">✦</span>
        </div>

        <section class="flex flex-1 items-center justify-center px-6 py-10 sm:px-12 lg:min-h-screen lg:px-16">
            <div class="w-full max-w-md">
                <p class="text-sm font-semibold uppercase tracking-[0.2em] text-[#6a994e]">Get started</p>
                <h2 class="mt-3 text-3xl font-bold tracking-tight sm:text-4xl">Create your account</h2>
                <p class="mt-3 text-[#59665a]">It only takes a moment to join the conversation.</p>

                <form class="mt-8 rounded-2xl border border-[#e7e8df] bg-white p-6 shadow-[0_20px_60px_-35px_rgba(19,42,19,0.35)] sm:p-8" action="/register" method="POST">
                    <div class="mb-5">
                        <label class="mb-2 block text-sm font-semibold text-[#263626]" for="username">Username</label>
                        <input class="w-full rounded-lg border border-[#dfe3d8] bg-[#fbfcf9] px-4 py-3 text-[#132a13] outline-none transition placeholder:text-[#9aa397] focus:border-[#6a994e] focus:ring-4 focus:ring-[#6a994e]/15" id="username" type="text" name="username" placeholder="Choose a username" autocomplete="username" required>
                    </div>
                    <div class="mb-7">
                        <label class="mb-2 block text-sm font-semibold text-[#263626]" for="password">Password</label>
                        <input class="w-full rounded-lg border border-[#dfe3d8] bg-[#fbfcf9] px-4 py-3 text-[#132a13] outline-none transition placeholder:text-[#9aa397] focus:border-[#6a994e] focus:ring-4 focus:ring-[#6a994e]/15" id="password" type="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
                    </div>
                    <button class="w-full rounded-lg bg-[#386641] px-5 py-3 font-semibold text-white transition hover:bg-[#132a13] focus:outline-none focus:ring-4 focus:ring-[#6a994e]/30" type="submit">Create account</button>
                    <p class="mt-6 text-center text-sm text-[#59665a]">Already have an account? <a href="index.html" class="font-semibold text-[#386641] underline decoration-[#a7c957] decoration-2 underline-offset-4 hover:text-[#132a13]">Log in</a></p>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
