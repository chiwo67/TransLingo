<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Translate | TransLingo</title>
</head>
<body class="min-h-screen bg-[#f7f5ee] text-[#132a13]">
    <header class="flex items-center justify-between bg-[#132a13] px-6 py-5 sm:px-12">
        <h1 class="text-xl font-bold tracking-[0.2em] text-[#f2e8cf]" id="home-title">TRANSLINGO</h1>
        <nav class="flex items-center gap-5 text-sm">
            <a href="home.html" class="text-white/75 hover:text-white">Home</a>
            <button id="logout-btn" type="button" class="rounded-lg border border-white/20 px-4 py-2 font-semibold text-white transition hover:bg-white/10">Log out</button>
        </nav>
    </header>

    <main class="mx-auto w-full max-w-5xl px-6 py-10 sm:px-12">
        <p class="text-sm font-semibold uppercase tracking-[0.2em] text-[#6a994e]">Translator</p>
        <h2 class="mt-3 text-3xl font-bold tracking-tight sm:text-4xl">Translate your text</h2>
        <p class="mt-3 text-[#59665a]">Pick two languages, type your text, and translate.</p>

        <div class="mt-8 rounded-2xl border border-[#e7e8df] bg-white p-6 shadow-[0_20px_60px_-35px_rgba(19,42,19,0.35)] sm:p-8">
            <div class="flex flex-col items-stretch gap-3 sm:flex-row sm:items-center">
                <select id="from-lang" aria-label="Translate from" class="w-full rounded-lg border border-[#dfe3d8] bg-[#fbfcf9] px-4 py-3 outline-none focus:border-[#6a994e] focus:ring-4 focus:ring-[#6a994e]/15">
                    <option value="en">English</option>
                    <option value="sw">Swahili</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                    <option value="de">German</option>
                    <option value="zh-CN">Chinese (Simplified)</option>
                </select>
                <button id="swap-btn" type="button" aria-label="Swap languages" class="shrink-0 rounded-full border border-[#d8dfc7] bg-[#f7f5ee] px-4 py-3 text-[#386641] transition hover:bg-[#a7c957]/30">⇄</button>
                <select id="to-lang" aria-label="Translate to" class="w-full rounded-lg border border-[#dfe3d8] bg-[#fbfcf9] px-4 py-3 outline-none focus:border-[#6a994e] focus:ring-4 focus:ring-[#6a994e]/15">
                    <option value="sw">Swahili</option>
                    <option value="en">English</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                    <option value="de">German</option>
                    <option value="zh-CN">Chinese (Simplified)</option>
                </select>
            </div>

            <div class="mt-5 grid gap-5 md:grid-cols-2">
                <textarea id="input-text" aria-label="Text to translate" maxlength="500" rows="8" placeholder="Type text to translate..." class="w-full resize-none rounded-lg border border-[#dfe3d8] bg-[#fbfcf9] px-4 py-3 outline-none placeholder:text-[#9aa397] focus:border-[#6a994e] focus:ring-4 focus:ring-[#6a994e]/15"></textarea>
                <textarea id="output-text" aria-label="Translation result" rows="8" readonly placeholder="Translation appears here" class="w-full resize-none rounded-lg border border-[#dfe3d8] bg-[#f1f4ea] px-4 py-3 outline-none placeholder:text-[#9aa397]"></textarea>
            </div>

            <div class="mt-5 flex flex-col gap-3 sm:flex-row">
                <button id="translate-btn" type="button" class="rounded-lg bg-[#386641] px-6 py-3 font-semibold text-white transition hover:bg-[#132a13] focus:outline-none focus:ring-4 focus:ring-[#6a994e]/30 disabled:opacity-60">Translate</button>
                <button id="copy-btn" type="button" class="rounded-lg border border-[#386641] px-6 py-3 font-semibold text-[#386641] transition hover:bg-[#386641] hover:text-white">Copy</button>
            </div>

            <div id="error-message" class="mt-4 text-sm text-red-500" role="alert" hidden></div>
        </div>
    </main>

    <script src="../scripts/translate.js"></script>
</body>
</html>
