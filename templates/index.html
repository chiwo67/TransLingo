<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login</title>
  </head>
  <body class="bg-black">
    <section class="container mx-auto px-4 bg-black min-h-screen flex items-center justify-center">
      <section class="flex flex-col items-center justify-center min-h-screen">
        <h1 class="text-3xl font-bold py-5 text-white">TransLingo</h1>
        <form class="bg-white shadow-md rounded px-20 pt-6 pb-8 mb-4" action="/login" method="POST">
          <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="username">Username</label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="username" type="text" name="username" required />
          </div>
          <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password</label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="password" type="password" name="password" required />
          </div>
          <div class="flex items-center justify-between">
            <button class="bg-yellow-500 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">Login</button>
          </div>
          <div class="mt-4">
            <p class="text-gray-700 text-sm">Don't have an account? <a href="register.html" class="text-blue-500 hover:text-blue-700">Register</a></p>
          </div>
          <div class="mt-4" id="error-message" style="display: none;">
            <p class="text-red-500 text-sm"></p>
          </div>
        </form>
      </section>
    </section>
  </body>
</html>
