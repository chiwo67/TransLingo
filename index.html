<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login</title>
  </head>
  <body class="bg-black">
    <section class="w-full bg-[#6a994e] min-h-screen flex flex-col md:flex-row items-center md:items-stretch justify-start">
      <section class="w-full md:w-1/3 px-4 py-12 md:min-h-screen flex flex-col items-center justify-center">
        <h1 class="text-3xl font-bold py-5 text-white">TransLingo</h1>
        <form class="w-full max-w-md bg-[#a7c957] shadow-md rounded px-8 pt-6 pb-8 mb-4" action="/login" method="POST">
          <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="username">Username</label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="username" type="text" name="username" required />
          </div>
          <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password</label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="password" type="password" name="password" required />
          </div>
          <div class="flex items-center justify-between">
            <button class="bg-yellow-500 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">Login</button>
          </div>
          <div class="mt-4">
            <p class="text-gray-700 text-sm">Don't have an account? <a href="register.html" class="text-blue-500 hover:text-blue-700">Register</a></p>
          </div>
          <div class="mt-4" id="error-message" style="display: none;">
            <p class="text-red-500 text-sm"></p>
          </div>
        </form>
      </section>
      <aside class="w-full md:w-1/3 md:ml-auto px-8 py-12 md:min-h-screen flex flex-col justify-center text-white">
        <p class="text-sm font-semibold uppercase tracking-widest text-[#f2e8cf]">Welcome to TransLingo</p>
        <h2 class="mt-3 text-4xl font-bold leading-tight">Make every conversation count.</h2>
        <p class="mt-5 text-lg text-white/90">Connect across languages with simple, thoughtful translation tools built to bring people closer.</p>
        <p class="mt-8 border-l-4 border-[#f2e8cf] pl-4 text-white/90">Your next conversation has no language barrier.</p>
      </aside>
    </section>
  </body>
</html>
